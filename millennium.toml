[plugin]
id = "com.snowfallinsummer.reviewbar"
name = "Review Bar"
version = "1.0.0"
author = "SnowFallinSummer"
description = "Shows positive and negative Steam review percentages in a bar."

[webkit]
entry = "webview/preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "frontend"
