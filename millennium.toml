[plugin]
id = "com.snowfallinsummer.reviewbar"
name = "Review Bar"
version = "1.0.0"
author = "SnipCheddaBombs"
description = "Shows positive and negative review percentages as a bar on supported Steam Store pages."

[webkit]
entry = "webview/preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "frontend"
