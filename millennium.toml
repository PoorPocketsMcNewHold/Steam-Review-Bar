[plugin]
id = "com.snowfallinsummer.reviewbar"
name = "Review Bar"
version = "1.0.0"
author = "SnipCheddaBombs"
description = "Turns Steam's positive and negative review percentages into an easy-to-read bar."

[webkit]
entry = "webview/preload.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "frontend"
